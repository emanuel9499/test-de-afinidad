<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test de Afinidad de Anime</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0b0d13;
    --surface: #131722;
    --surface2: #1a1f2d;
    --surface3: #222839;
    --line: rgba(255,255,255,.08);
    --line2: rgba(255,255,255,.14);
    --text: #eef1f7;
    --muted: #a3acc0;
    --dim: #7c869e;
    --accent: #ffa53d;
    --radius: 16px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
    margin: 0; min-height: 100vh;
    font-family: 'Outfit', system-ui, sans-serif;
    background: var(--bg);
    background-image:
        radial-gradient(900px 520px at 10% -10%, rgba(255,165,61,.12), transparent 60%),
        radial-gradient(800px 520px at 100% 0%, rgba(122,162,255,.09), transparent 60%);
    background-attachment: fixed;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
}
button, input, select { font-family: inherit; color: inherit; }
select option { background: var(--surface2); color: var(--text); }

.wrap { max-width: 860px; margin: 0 auto; padding: 40px 20px 50px; }

/* ── Hero ── */
.hero { text-align: center; margin-bottom: 28px; }
.hero .logo {
    width: 54px; height: 54px; margin: 0 auto 14px; border-radius: 16px;
    display: grid; place-items: center; font-size: 1.6em;
    background: linear-gradient(135deg, #ffa53d, #ff5c7a);
    box-shadow: 0 10px 30px rgba(255,140,60,.35);
}
.hero h1 { margin: 0 0 6px; font-size: 2em; font-weight: 800; letter-spacing: -.5px; }
.hero p { margin: 0; color: var(--muted); }

/* ── Form ── */
.form {
    display: flex; flex-direction: column; gap: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px; box-shadow: 0 14px 40px rgba(0,0,0,.35);
}
.user-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.vs-tag {
    width: 100%; text-align: center; font-size: .75em; font-weight: 800; letter-spacing: .15em; color: var(--accent);
    display: flex; align-items: center; gap: 10px; margin: 2px 0;
}
.vs-tag::before, .vs-tag::after { content: ""; flex: 1; height: 1px; background: var(--line2); }
.icon-btn {
    width: 44px; height: 44px; border-radius: 11px; border: 1px solid var(--line2); background: var(--surface2);
    color: var(--muted); cursor: pointer; font-size: 1em;
}
.icon-btn:hover { color: var(--text); background: var(--surface3); }
.form-foot { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.link-btn { background: none; border: none; color: #ffc98a; cursor: pointer; font-size: .9em; font-weight: 600; padding: 6px 4px; }
.link-btn:hover { color: #fff; }
.platforms { display: flex; background: var(--surface2); border-radius: 11px; padding: 3px; }
.platforms label { position: relative; cursor: pointer; }
.platforms input { position: absolute; opacity: 0; pointer-events: none; }
.platforms span {
    display: inline-flex; align-items: center; height: 38px; padding: 0 14px; border-radius: 9px;
    font-size: .92em; font-weight: 600; color: var(--muted); transition: all .15s;
}
.platforms input:checked + span { background: var(--surface3); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,.3); }
.platforms input:focus-visible + span { outline: 2px solid var(--accent); }
.user-input {
    flex: 1 1 200px; height: 44px; padding: 0 14px; border-radius: 11px;
    background: var(--surface2); border: 1px solid var(--line2); font-size: 1em; outline: none;
    transition: border-color .15s;
}
.user-input:focus { border-color: var(--accent); }
.user-input::placeholder { color: var(--dim); }
.btn {
    height: 44px; padding: 0 20px; border-radius: 11px; border: none; cursor: pointer;
    font-weight: 700; font-size: .95em; display: inline-flex; align-items: center; gap: 8px; justify-content: center;
    transition: transform .12s, box-shadow .15s, opacity .15s;
}
.btn.primary { background: linear-gradient(135deg, #ffa53d, #ff7a45); color: #1a0e00; box-shadow: 0 4px 16px rgba(255,140,60,.35); }
.btn.primary:hover:not(:disabled) { box-shadow: 0 6px 22px rgba(255,140,60,.5); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.ghost { background: var(--surface2); border: 1px solid var(--line2); color: var(--text); height: 36px; font-size: .85em; padding: 0 14px; }
.btn.ghost:hover { background: var(--surface3); }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(26,14,0,.3); border-top-color: #1a0e00; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.recent { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; font-size: .82em; color: var(--dim); align-items: center; }
.recent button {
    background: transparent; border: 1px solid var(--line2); color: var(--muted); border-radius: 999px;
    padding: 3px 10px; cursor: pointer; font-size: 1em;
}
.recent button:hover { color: var(--text); border-color: rgba(255,255,255,.3); }

/* ── Mensajes ── */
.msg {
    margin-top: 24px; padding: 16px 18px; border-radius: 14px; font-size: .95em;
    background: rgba(255,120,120,.08); border: 1px solid rgba(255,120,120,.3); color: #ffd0d0;
}
.msg b { color: #fff; }

/* ── Resultado ── */
.result { margin-top: 30px; animation: fadeUp .45s ease both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

.winner {
    position: relative; overflow: hidden;
    border-radius: 20px; padding: 26px 24px; text-align: center;
    background: linear-gradient(140deg, color-mix(in srgb, var(--tc) 28%, var(--surface)), var(--surface) 70%);
    border: 1px solid color-mix(in srgb, var(--tc) 45%, transparent);
    box-shadow: 0 20px 50px rgba(0,0,0,.4), 0 0 60px color-mix(in srgb, var(--tc) 14%, transparent);
}
.winner .kicker { font-size: .78em; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.winner .name { font-size: 2.2em; font-weight: 800; margin: 4px 0 2px; color: var(--tc-text); }
.winner .pct { font-size: 3.2em; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.winner .desc { color: var(--muted); margin-top: 10px; font-size: .92em; }
.winner .tie { color: #ffe2b0; margin-top: 6px; font-size: .88em; }
.winner-user { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 10px; color: var(--muted); font-size: .9em; }
.winner-user img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 13px; padding: 12px 14px; }
.stat .k { font-size: .72em; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.stat .v { font-size: 1.4em; font-weight: 700; font-variant-numeric: tabular-nums; }

.actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
.opt { display: inline-flex; align-items: center; gap: 8px; font-size: .85em; color: var(--muted); cursor: pointer; user-select: none; }
.opt input { accent-color: var(--accent); width: 16px; height: 16px; }

h2.section { font-size: 1.05em; font-weight: 700; margin: 30px 0 12px; display: flex; align-items: center; gap: 8px; }
h2.section small { font-weight: 400; color: var(--dim); font-size: .85em; }

/* Teams */
.team {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    margin-bottom: 10px; overflow: hidden; transition: border-color .2s;
}
.team.open { border-color: color-mix(in srgb, var(--tc) 40%, transparent); }
.team-head {
    width: 100%; background: transparent; border: none; cursor: pointer; text-align: left;
    padding: 16px 18px; display: grid; grid-template-columns: 34px 1fr auto 20px; align-items: center; gap: 14px;
}
.team-head:hover { background: rgba(255,255,255,.02); }
.place {
    width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 800;
    background: var(--surface3); color: var(--text);
}
.place.p1 { background: linear-gradient(135deg, #ffe082, #f5b82e); color: #2a1d00; }
.place.p2 { background: linear-gradient(135deg, #f1f4f9, #b9c2d0); color: #1c2230; }
.place.p3 { background: linear-gradient(135deg, #f0b27a, #c9773d); color: #2b1504; }
.team-name { font-weight: 700; font-size: 1.05em; color: var(--tc-text); }
.track { height: 10px; border-radius: 99px; background: rgba(255,255,255,.07); margin-top: 8px; overflow: hidden; }
.fill { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, color-mix(in srgb, var(--tc) 70%, #fff 0%), var(--tc)); transition: width 1s cubic-bezier(.2,.8,.2,1); }
.team-pct { font-size: 1.5em; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 66px; text-align: right; }
.chev { color: var(--dim); transition: transform .2s; font-size: .9em; }
.team.open .chev { transform: rotate(180deg); }

.team-body { padding: 0 18px 18px; }
.likes { font-size: .82em; color: var(--muted); margin-bottom: 12px; }
.likes b { color: var(--text); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
    display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px;
    background: var(--surface2); border: 1px solid var(--line2); color: var(--text); cursor: pointer; font-size: .85em;
    transition: all .15s;
}
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; }
.chip:hover { border-color: color-mix(in srgb, var(--tc) 55%, transparent); }
.chip.active { background: color-mix(in srgb, var(--tc) 20%, var(--surface2)); border-color: color-mix(in srgb, var(--tc) 65%, transparent); }
.chip.active .n { color: var(--text); }
.chip.zero { opacity: .45; cursor: default; }

.anime-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 12px; margin-top: 14px;
}
.anime {
    text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 6px;
    animation: fadeUp .3s ease both;
}
.anime .cover {
    position: relative; aspect-ratio: 2 / 2.85; border-radius: 10px; overflow: hidden;
    background: linear-gradient(160deg, var(--surface3), var(--surface2));
    border: 1px solid var(--line);
}
.anime img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
.anime:hover img { transform: scale(1.05); }
.anime .score {
    position: absolute; top: 6px; right: 6px; padding: 2px 7px; border-radius: 6px; font-size: .75em; font-weight: 700;
    background: rgba(13,16,24,.85); color: #ffe07a;
}
.anime .t { font-size: .8em; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: #dfe4ef; }
.more { margin-top: 12px; text-align: center; }

/* Géneros generales */
.genre-bars { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.gbar { display: grid; grid-template-columns: 130px 1fr 44px; gap: 10px; align-items: center; font-size: .86em; margin-bottom: 8px; }
.gbar:last-child { margin-bottom: 0; }
.gbar .gname { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gbar .gtrack { height: 8px; border-radius: 99px; background: rgba(255,255,255,.06); overflow: hidden; display: flex; }
.gbar .gtrack i { height: 100%; }
.gbar .gnum { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; font-size: .78em; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* Skeleton */
.skel { margin-top: 30px; }
.skel div {
    border-radius: 16px; margin-bottom: 10px;
    background: linear-gradient(90deg, rgba(255,255,255,.03), rgba(255,255,255,.08), rgba(255,255,255,.03));
    background-size: 200% 100%; animation: shimmer 1.3s linear infinite;
}
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

.toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0;
    background: var(--surface3); border: 1px solid var(--line2); padding: 10px 16px; border-radius: 10px;
    font-size: .9em; transition: all .25s; pointer-events: none; z-index: 50;
}
.toast.show { opacity: 1; transform: translateX(-50%); }

/* Explicación */
.why { margin-top: 12px; font-size: .95em; line-height: 1.55; color: #d5dbe8; max-width: 620px; margin-left: auto; margin-right: auto; }
.why b { color: #fff; }
.core-mark { color: #ffd27a; font-size: .8em; font-weight: 700; }
.slow { text-align: center; color: var(--muted); font-size: .9em; margin: 4px 0 14px; }

/* Comparación */
.duo { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: stretch; }
.duo .winner { padding: 20px 16px; }
.duo .winner .name { font-size: 1.6em; }
.duo .winner .pct { font-size: 2.4em; }
.compat {
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    min-width: 130px; padding: 14px; border-radius: 20px;
    background: var(--surface); border: 1px solid rgba(255,165,61,.4);
    box-shadow: 0 0 40px rgba(255,165,61,.12);
}
.compat .k { font-size: .7em; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.compat .v { font-size: 2.4em; font-weight: 800; background: linear-gradient(135deg, #ffd27a, #ff7a45); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1.1; }
.compat .l { font-size: .78em; color: #ffd9b0; margin-top: 2px; }
.compare-text { text-align: center; margin-top: 14px; color: #d5dbe8; line-height: 1.55; font-size: .95em; }
.compare-text b { color: #fff; }

.dual { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.dual-row { margin-bottom: 14px; }
.dual-row:last-child { margin-bottom: 0; }
.dual-row .tn { font-weight: 700; font-size: .95em; margin-bottom: 6px; color: var(--tc-text); }
.dual-bar { display: grid; grid-template-columns: 110px 1fr 46px; gap: 10px; align-items: center; font-size: .82em; margin-top: 4px; }
.dual-bar .who { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dual-bar .track { margin-top: 0; height: 9px; }
.dual-bar .fill.b { opacity: .55; }
.dual-bar .p { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }

.gcmp { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px; }
.gcmp-head, .gcmp-row { display: grid; grid-template-columns: 44px 1fr 120px 1fr 44px; gap: 8px; align-items: center; font-size: .84em; }
.gcmp-head { color: var(--muted); font-size: .76em; margin-bottom: 8px; }
.gcmp-head span:first-child { grid-column: 1 / 3; text-align: right; }
.gcmp-head span:last-child { grid-column: 4 / 6; }
.gcmp-head span:nth-child(2) { text-align: center; }
.gcmp-row { margin-bottom: 7px; }
.gcmp-row .g { text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gcmp-row .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.gcmp-row .n.r { text-align: right; }
.half { height: 8px; border-radius: 99px; background: rgba(255,255,255,.06); overflow: hidden; display: flex; }
.half.l { justify-content: flex-end; }
.half i { height: 100%; border-radius: 99px; }

.pair-scores { position: absolute; left: 6px; right: 6px; bottom: 6px; display: flex; justify-content: space-between; gap: 4px; }
.pair-scores span { padding: 2px 6px; border-radius: 6px; font-size: .7em; font-weight: 700; background: rgba(13,16,24,.88); color: #ffe07a; }
.recs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.recs > div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.recs h3 { margin: 0 0 4px; font-size: .92em; }
.recs h3 b { color: #ffc98a; }
.recs .anime-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); margin-top: 10px; }
.empty-note { color: var(--dim); font-size: .85em; margin: 6px 0 0; }

/* Modal imagen */
.modal-bg { position: fixed; inset: 0; z-index: 100; background: rgba(5,7,12,.78); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 16px; }
.modal { width: min(460px, 100%); max-height: 100%; overflow: auto; background: var(--surface); border: 1px solid var(--line2); border-radius: 18px; padding: 16px; }
.modal img { width: 100%; border-radius: 12px; display: block; }
.mactions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.mactions .btn { flex: 1; height: 40px; }

footer { text-align: center; color: var(--dim); font-size: .78em; margin-top: 40px; }

@media (max-width: 600px) {
    .wrap { padding: 26px 14px 40px; }
    .hero h1 { font-size: 1.55em; }
    .platforms label { flex: 1; }
    .platforms span { width: 100%; justify-content: center; }
    .btn.primary { width: 100%; }
    .team-head { grid-template-columns: 30px 1fr auto 16px; gap: 10px; padding: 14px; }
    .team-pct { font-size: 1.25em; min-width: 52px; }
    .team-body { padding: 0 14px 14px; }
    .winner .name { font-size: 1.7em; }
    .winner .pct { font-size: 2.6em; }
    .gbar { grid-template-columns: 96px 1fr 36px; }
    .duo { grid-template-columns: 1fr 1fr; }
    .compat { grid-column: 1 / -1; grid-row: 2; flex-direction: row; gap: 12px; }
    .duo .winner .name { font-size: 1.2em; }
    .duo .winner .pct { font-size: 1.8em; }
    .recs { grid-template-columns: 1fr; }
    .gcmp-head, .gcmp-row { grid-template-columns: 34px 1fr 84px 1fr 34px; gap: 6px; }
    .dual-bar { grid-template-columns: 80px 1fr 40px; }
    .user-row .platforms { width: 100%; }
    .form-foot .btn.primary { width: 100%; }
    .anime-grid { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
}
</style>
</head>
<body>
<div class="wrap">
    <header class="hero">
        <div class="logo">⚔</div>
        <h1>Test de Afinidad de Anime</h1>
        <p>Analizamos tu lista y te decimos a qué team pertenecés.</p>
    </header>

    <form class="form" id="form" autocomplete="off">
        <div class="user-row">
            <div class="platforms" role="radiogroup" aria-label="Plataforma">
                <label><input type="radio" name="platform" value="mal" checked><span>MyAnimeList</span></label>
                <label><input type="radio" name="platform" value="anilist"><span>AniList</span></label>
            </div>
            <input class="user-input" id="username" type="text" placeholder="Tu username" spellcheck="false" required>
        </div>
        <div id="row2" hidden>
            <div class="vs-tag">VS</div>
            <div class="user-row">
                <div class="platforms" role="radiogroup" aria-label="Plataforma del segundo usuario">
                    <label><input type="radio" name="platform2" value="mal" checked><span>MyAnimeList</span></label>
                    <label><input type="radio" name="platform2" value="anilist"><span>AniList</span></label>
                </div>
                <input class="user-input" id="username2" type="text" placeholder="Username a comparar" spellcheck="false">
                <button class="icon-btn" id="removeRow2" type="button" title="Quitar comparación">✕</button>
            </div>
        </div>
        <div class="form-foot">
            <button class="link-btn" id="addCompare" type="button">+ Comparar con otro usuario</button>
            <button class="btn primary" id="submitBtn" type="submit">Calcular afinidad</button>
        </div>
    </form>
    <div class="recent" id="recent" hidden></div>

    <div id="output"></div>

    <footer>Se analizan los animes vistos, en curso y en pausa de tu lista (los planeados no cuentan).</footer>
</div>

<div class="toast" id="toast"></div>

<div class="modal-bg" id="imgModal" hidden>
    <div class="modal">
        <img id="imgPreview" alt="Imagen del resultado">
        <div class="mactions">
            <button class="btn primary" id="imgDownload" type="button">Descargar</button>
            <button class="btn ghost" id="imgCopy" type="button">Copiar</button>
            <button class="btn ghost" id="imgShare" type="button" hidden>Compartir</button>
            <button class="btn ghost" id="imgClose" type="button">Cerrar</button>
        </div>
    </div>
</div>

<script src="main.js"></script>
</body>
</html>
